<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://fonts.googleapis.com/css?family=Merriweather' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Mulish' rel='stylesheet'>
    <link href="style.css" rel="stylesheet">
    <script src="script.js" type="module" defer></script>
    <title></title>
</head>

<body>
    <div id="root">
        <header>
            <section class="top">
                <h1>MyMovies</h1>
                <button id="toggle">
                    <div id="handle">

                    </div>
                </button>
            </section>
        </header>

        <main>
            <section class="now_showing">
                <div id="title">
                    <h1>Now Showing</h1>
                    <button class="see_more">See more</button>
                </div>

                <div id="now_showing_movies">

                </div>
            </section>

            <section class="popular">
                <div id="title">
                    <h1>Popular</h1>
                    <button class="see_more">See more</button>
                </div>

                <div id="popular_movies">

                </div>
            </section>
        </main>

        <footer>
            <section class="bottom_navbar">
                <nav>
                    <img src="images/bookmark.svg">
                    <img src="images/bookmark_copy.svg">
                    <img src="images/bookmark_copy_2.svg">
                </nav>
            </section>
        </footer>
    </div>
</body>

</html>
